<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議メモ | 令和細見舎</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#19334c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:800px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.45rem;margin:10px 0}a{color:#2365a0}.sub{color:#607589;font-size:.85rem}.panel{background:white;border:1px solid #dbe4ee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1636520a}input,textarea{font:inherit;border:1px solid #c6d3df;border-radius:9px;padding:11px;width:100%}textarea{min-height:85px;resize:vertical}button{font:inherit;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;background:#2368ac;color:white}button.secondary{background:#e5edf5;color:#1a4466}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.memo{border:2px solid transparent;background:#edf3f9;border-radius:13px;padding:14px;margin:10px 0;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}.memo.active{border-color:#2384d1;background:#e2f2ff}.memo small{display:block;color:#667b8c;margin-bottom:7px}.memo .content{line-height:1.65}.hint{font-size:.88rem;color:#557187}.status{min-height:1.5em;font-size:.9rem}.footer{padding:20px 0;text-align:center}.hidden{display:none}label{display:block;margin:12px 0 5px;font-size:.9rem}input[type=checkbox]{width:auto} @media(max-width:480px){.wrap{padding:10px}.panel{padding:12px}}
#meeting{font-weight:700}
</style></head><body><main class="wrap"><header><h1>会議メモ</h1><a href="https://bunpuku-hitone.github.io/hitone-books-digest/" target="_blank" rel="noopener">あい右衛門・令和細見舎</a></header><section class="panel"><input id="meeting" aria-label="会議名" placeholder="会議名入力　例：企画会議"></section><section id="notes" aria-label="メモ一覧"></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px"><strong id="target">新しいメモ枠</strong><button id="clearSelection" class="secondary">選択を解除</button></div><textarea id="draft" placeholder="メモを入力…"></textarea><div class="row" style="margin-top:10px"><button id="add">メモを ENTER</button></div></section><section class="panel"><h2 style="font-size:1.1rem">会議メモをメール送信する</h2><input aria-label="お名前" id="person" autocomplete="name" placeholder="お名前"><label for="email">送信先メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label><input id="newsletter" type="checkbox"> 令和細見舎からのお知らせをメールで受け取る（任意）</label><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button id="sendDirect">会議メモをメール送信</button><button id="reset" class="secondary">メモを消去する</button></div><p id="status" class="status" role="status"></p></section><p class="footer sub">便利を作り、与え続ける開発舎</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='hitone-meeting-memo-v1';let notes=[],selected=null;try{const saved=JSON.parse(localStorage.getItem(key)||'{}');notes=Array.isArray(saved.notes)?saved.notes:[];$('meeting').value=saved.meeting||''}catch{}const persist=()=>localStorage.setItem(key,JSON.stringify({notes,meeting:$('meeting').value}));const fmt=t=>new Date(t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});function render(){const root=$('notes');root.replaceChildren();notes.forEach((n,i)=>{const el=document.createElement('div');el.className='memo'+(selected===n.id?' active':'');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`${i+1}番のメモを選択`);const small=document.createElement('small');small.textContent=`${i+1}　${fmt(n.time)}`;const content=document.createElement('div');content.className='content';content.textContent=n.text;el.append(small,content);const choose=()=>{selected=n.id;render();$('draft').focus()};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};root.append(el)});$('target').textContent=selected===null?'新しいメモ枠':`メモ ${notes.findIndex(n=>n.id===selected)+1} に追記`;}function unselect(){selected=null;render();$('draft').focus()}$('clearSelection').onclick=unselect;$('meeting').oninput=persist;$('add').onclick=()=>{const value=$('draft').value.trim();if(!value)return;if(selected===null){notes.push({id:crypto.randomUUID(),time:Date.now(),text:value})}else{const n=notes.find(x=>x.id===selected);if(n)n.text+='\n'+value;else notes.push({id:crypto.randomUUID(),time:Date.now(),text:value})}$('draft').value='';persist();render();$('draft').focus()};$('draft').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){$('add').click()}};function exportText(){return `${$('meeting').value||'会議メモ'}\n${new Date().toLocaleString('ja-JP')}\n\n`+notes.map((n,i)=>`${i+1}. ${n.text}`).join('\n\n')}function valid(){if(!notes.length){$('status').textContent='メモがありません。';return false}if(!$('person').value.trim()||!$('email').checkValidity()||!$('email').value){$('status').textContent='お名前と有効なメールアドレスを入力してください。';return false}return true}const endpoint='https://aiuemon-mail.hitone-idobata.workers.dev/';$('sendDirect').onclick=async()=>{if(!valid())return;const to=$('email').value.trim();if(false){$('status').textContent='現在の直接送信は管理者のメールアドレス宛てのみ対応しています。他の送信先には「メールアプリで送信」をお使いください。';return}const button=$('sendDirect');button.disabled=true;$('status').textContent='送信しています…';try{const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,subject:'会議メモ：'+($('meeting').value||'無題'),text:exportText()})});let result={};try{result=await res.json()}catch{}if(!res.ok||result.error){$('status').textContent='送信できませんでした：'+(result.error||res.status);return}$('status').textContent='送信APIが受け付けました。メールの到着を確認してください。'}catch(e){$('status').textContent='送信できませんでした。接続状態を確認してください。'}finally{button.disabled=false}};$('reset').onclick=()=>{if(!confirm('メモをすべて消去しますか？ メール送信が完了していることを確認してください。'))return;notes=[];selected=null;$('meeting').value='';persist();render();$('status').textContent='メモと会議名を消去しました。'};render()})();
</script></body></html>
